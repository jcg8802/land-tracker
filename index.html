<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌄 Large Land Tracts — JClaw</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-card: #1c2128;
  --bg-hover: #252c35;
  --border: #30363d;
  --border-light: #3d444d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;
  --orange: #f0883e;
  --purple: #bc8cff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --teal: #39d3bb;
  --gold: #f0c060;
  --brown: #c09553;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
}

.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 1000;
  position: relative;
  flex-wrap: wrap;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo span { color: var(--accent); }
.logo .fox { font-size: 22px; }

.stats-bar {
  display: flex;
  gap: 20px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-left: auto;
  flex-wrap: wrap;
}
.stat { display: flex; align-items: center; gap: 5px; }
.stat strong { color: var(--text-primary); }

.filter-row {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  z-index: 999;
  position: relative;
}
.filter-row select, .filter-row input {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.filter-row select:hover { border-color: var(--border-light); }
.filter-label { font-size: 12px; color: var(--text-secondary); }

.main {
  display: grid;
  grid-template-columns: 400px 1fr;
  height: calc(100vh - 94px);
}

.sidebar {
  background: var(--bg-primary);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}
.card:hover { border-color: var(--border-light); background: var(--bg-hover); transform: translateY(-1px); }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)33; }
.card.ce-flagged { border-color: var(--red)66; }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.card-address {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.3;
  flex: 1;
  margin-right: 8px;
}
.card-price {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  white-space: nowrap;
}
.card-ppa { font-size: 11px; color: var(--text-muted); font-weight: 400; }

.card-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 500;
  border: 1px solid;
}
.badge-ranch { color: var(--brown); border-color: var(--brown)44; background: var(--brown)11; }
.badge-farmland { color: var(--green); border-color: var(--green)44; background: var(--green)11; }
.badge-timberland { color: var(--teal); border-color: var(--teal)44; background: var(--teal)11; }
.badge-recreational { color: var(--orange); border-color: var(--orange)44; background: var(--orange)11; }
.badge-recreational\/hunting { color: var(--orange); border-color: var(--orange)44; background: var(--orange)11; }
.badge-mountain { color: var(--purple); border-color: var(--purple)44; background: var(--purple)11; }
.badge-mountain\/mixed-use { color: var(--purple); border-color: var(--purple)44; background: var(--purple)11; }
.badge-waterfront { color: var(--accent); border-color: var(--accent)44; background: var(--accent)11; }
.badge-state { color: var(--text-secondary); border-color: var(--border); background: transparent; }
.badge-ce { color: var(--red); border-color: var(--red)66; background: var(--red)18; font-weight: 700; }
.badge-ce-unknown { color: var(--yellow); border-color: var(--yellow)44; background: var(--yellow)11; }

.card-details {
  display: flex;
  gap: 12px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.card-details span { display: flex; align-items: center; gap: 3px; }

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.days-on-market {
  font-size: 11px;
  color: var(--text-muted);
}
.days-on-market.fresh { color: var(--green); }
.days-on-market.warm { color: var(--yellow); }
.days-on-market.stale { color: var(--red); }

.btn-link {
  font-size: 11px;
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--accent)44;
  padding: 3px 10px;
  border-radius: 5px;
  transition: all 0.15s;
}
.btn-link:hover { background: var(--accent)22; }

.card-notes {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  font-style: italic;
}

.ce-banner {
  font-size: 11px;
  color: var(--red);
  background: var(--red)14;
  border: 1px solid var(--red)44;
  border-radius: 6px;
  padding: 5px 8px;
  margin-bottom: 8px;
  font-weight: 600;
}

#map {
  z-index: 0;
}

.leaflet-popup-content-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
}
.leaflet-popup-tip { background: var(--bg-card); }
.popup-price { font-size: 15px; font-weight: 700; color: var(--gold); }
.popup-address { font-weight: 600; margin-bottom: 4px; }
.popup-meta { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
.popup-link { color: var(--accent); text-decoration: none; display: inline-block; margin-top: 6px; font-size: 12px; }
.popup-ce { color: var(--red); font-weight: 700; font-size: 12px; margin-top: 4px; }

@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; height: auto; }
  .sidebar { height: auto; max-height: 50vh; }
  #map { height: 50vh; }
  .header { height: auto; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span class="fox">🦊</span> Large Land Tracts <span>for sale — America</span></div>
  <div class="stats-bar">
    <div class="stat">🌄 <strong id="stat-count">0</strong> listings</div>
    <div class="stat">📐 total <strong id="stat-acres">—</strong> acres</div>
    <div class="stat">🔒 <strong id="stat-ce">0</strong> under easement</div>
    <div class="stat">🔄 <strong id="stat-updated">—</strong></div>
  </div>
</div>

<div class="filter-row">
  <span class="filter-label">Type:</span>
  <select id="filter-type" onchange="applyFilters()">
    <option value="">All types</option>
    <option value="ranch">🤠 Ranch</option>
    <option value="farmland">🌾 Farmland</option>
    <option value="timberland">🌲 Timberland</option>
    <option value="recreational/hunting">🏹 Recreational/Hunting</option>
    <option value="mountain/mixed-use">⛰️ Mountain/Mixed-use</option>
    <option value="waterfront">💧 Waterfront</option>
  </select>

  <span class="filter-label">Min acres:</span>
  <select id="filter-acres" onchange="applyFilters()">
    <option value="">Any</option>
    <option value="200">200+</option>
    <option value="500">500+</option>
    <option value="1000">1,000+</option>
    <option value="2500">2,500+</option>
    <option value="5000">5,000+</option>
  </select>

  <span class="filter-label">Max price:</span>
  <select id="filter-price" onchange="applyFilters()">
    <option value="">Any</option>
    <option value="1000000">Under $1M</option>
    <option value="5000000">Under $5M</option>
    <option value="10000000">Under $10M</option>
    <option value="25000000">Under $25M</option>
    <option value="50000000">Under $50M</option>
  </select>

  <span class="filter-label">Conservation easement:</span>
  <select id="filter-ce" onchange="applyFilters()">
    <option value="">Show all</option>
    <option value="no">Hide easement-encumbered</option>
    <option value="yes">Only easement-encumbered</option>
  </select>

  <span class="filter-label">Sort:</span>
  <select id="filter-sort" onchange="applyFilters()">
    <option value="newest">Newest</option>
    <option value="price-asc">Price ↑</option>
    <option value="price-desc">Price ↓</option>
    <option value="acres-desc">Acres ↓</option>
    <option value="ppa-asc">$/acre ↑</option>
  </select>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div id="map"></div>
</div>

<script>
let PROPERTIES = [];

// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [39.5, -98.35],
  zoom: 4
});

L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, © OpenStreetMap contributors',
  maxZoom: 16
}).addTo(map);

const MARKER_COLORS = {
  ranch: '#c09553',
  farmland: '#3fb950',
  timberland: '#39d3bb',
  'recreational/hunting': '#f0883e',
  'mountain/mixed-use': '#bc8cff',
  waterfront: '#58a6ff'
};

function makeIcon(type, ce) {
  const color = ce ? '#f85149' : (MARKER_COLORS[type] || '#8b949e');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z" fill="${color}" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
    <circle cx="12" cy="12" r="5" fill="rgba(0,0,0,0.3)"/>
    ${ce ? '<text x="12" y="16" font-size="9" text-anchor="middle" fill="#fff">🔒</text>' : ''}
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [24, 36],
    iconAnchor: [12, 36],
    popupAnchor: [0, -36]
  });
}

function formatPrice(p) {
  if (p >= 1000000) return '$' + (p/1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  return '$' + Math.round(p/1000) + 'K';
}

function domClass(days) {
  if (days == null) return '';
  if (days <= 14) return 'fresh';
  if (days <= 60) return 'warm';
  return 'stale';
}

function badgeClass(type) {
  return 'badge badge-' + (type || 'ranch').replace(/\//g, '\\/');
}

function domLabel(days) {
  if (days == null) return '';
  if (days === 1) return '1 day on market';
  return days + ' days on market';
}

function ceVal(p) {
  // true / 'true' both allowed
  return p.conservation_easement === true || p.conservation_easement === 'true' || p.conservation_easement === 'yes';
}

let markers = {};
let activeId = null;

function renderAll(props) {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  document.getElementById('stat-count').textContent = props.length;
  const totalAcres = props.reduce((s, p) => s + (p.acres || 0), 0);
  document.getElementById('stat-acres').textContent = totalAcres.toLocaleString();
  document.getElementById('stat-ce').textContent = props.filter(ceVal).length;

  const sidebar = document.getElementById('sidebar');
  if (props.length === 0) {
    sidebar.innerHTML = '<div class="no-results">🔍 No listings match your filters</div>';
    return;
  }

  sidebar.innerHTML = props.map(p => `
    <div class="card ${activeId === p.id ? 'active' : ''} ${ceVal(p) ? 'ce-flagged' : ''}" id="card-${p.id}" onclick="selectProperty('${p.id}')">
      <div class="card-top">
        <div class="card-address">${p.name}<br><small style="color:var(--text-muted);font-weight:400">${p.location}</small></div>
        <div style="text-align:right">
          <div class="card-price">${formatPrice(p.price_usd)}</div>
          <div class="card-ppa">$${Math.round(p.price_per_acre).toLocaleString()}/acre</div>
        </div>
      </div>
      ${ceVal(p) ? `<div class="ce-banner">🔒 UNDER CONSERVATION EASEMENT — ${p.conservation_easement_notes || 'development/subdivision rights restricted'}</div>` : ''}
      <div class="card-meta">
        <span class="${badgeClass(p.land_type)}">${p.land_type}</span>
        <span class="badge badge-state">${p.location}</span>
        ${p.conservation_easement === 'unknown' ? '<span class="badge badge-ce-unknown">⚠️ CE status unconfirmed</span>' : ''}
      </div>
      <div class="card-details">
        <span>📐 ${(p.acres||0).toLocaleString()} ac</span>
        <span>💧 ${p.water_features || 'none'}</span>
        <span>🏢 ${p.source || ''}</span>
      </div>
      <div class="card-footer">
        <div class="days-on-market ${domClass(p.days_on_market)}">${domLabel(p.days_on_market)}</div>
        <a href="${p.url}" target="_blank" class="btn-link" onclick="event.stopPropagation()">View →</a>
      </div>
      ${p.notes ? `<div class="card-notes">${p.notes}</div>` : ''}
    </div>
  `).join('');

  props.forEach(p => {
    const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.land_type, ceVal(p)) })
      .addTo(map)
      .bindPopup(`
        <div class="popup-address">${p.name}</div>
        <div class="popup-price">${formatPrice(p.price_usd)} <span style="font-weight:400;font-size:11px;color:var(--text-secondary)">($${Math.round(p.price_per_acre).toLocaleString()}/ac)</span></div>
        <div class="popup-meta">
          ${(p.acres||0).toLocaleString()} acres · ${p.land_type}<br>
          ${p.location}<br>
          ${domLabel(p.days_on_market)}
        </div>
        ${ceVal(p) ? `<div class="popup-ce">🔒 Under conservation easement${p.conservation_easement_notes ? ': ' + p.conservation_easement_notes : ''}</div>` : ''}
        ${p.notes ? `<div class="popup-meta" style="margin-top:4px;font-style:italic">${p.notes}</div>` : ''}
        <a href="${p.url}" target="_blank" class="popup-link">View listing →</a>
      `);
    marker.on('click', () => selectProperty(p.id));
    markers[p.id] = marker;
  });
}

function selectProperty(id) {
  activeId = id;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  const marker = markers[id];
  if (marker) { map.panTo(marker.getLatLng()); marker.openPopup(); }
}

function applyFilters() {
  const type = document.getElementById('filter-type').value;
  const minAcres = parseInt(document.getElementById('filter-acres').value) || 0;
  const maxPrice = parseInt(document.getElementById('filter-price').value) || Infinity;
  const ce = document.getElementById('filter-ce').value;
  const sort = document.getElementById('filter-sort').value;

  let filtered = PROPERTIES.filter(p => {
    if (type && p.land_type !== type) return false;
    if ((p.acres || 0) < minAcres) return false;
    if (p.price_usd > maxPrice) return false;
    if (ce === 'yes' && !ceVal(p)) return false;
    if (ce === 'no' && ceVal(p)) return false;
    return true;
  });

  if (sort === 'price-asc') filtered.sort((a, b) => a.price_usd - b.price_usd);
  else if (sort === 'price-desc') filtered.sort((a, b) => b.price_usd - a.price_usd);
  else if (sort === 'acres-desc') filtered.sort((a, b) => (b.acres||0) - (a.acres||0));
  else if (sort === 'ppa-asc') filtered.sort((a, b) => (a.price_per_acre||0) - (b.price_per_acre||0));
  else filtered.sort((a, b) => (b.date_added||'').localeCompare(a.date_added||'')); // newest

  renderAll(filtered);
}

// Load listings from listings-db.json (source of truth, updated by the daily cron)
fetch('listings-db.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    PROPERTIES = Object.values(data.listings || {});
    const lastUpdated = data.lastUpdated
      ? new Date(data.lastUpdated).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      : null;
    document.getElementById('stat-updated').textContent = lastUpdated ? 'Updated ' + lastUpdated : '—';
    applyFilters();
  })
  .catch(err => {
    console.error('Failed to load listings-db.json', err);
    document.getElementById('sidebar').innerHTML = '<div class="no-results">⚠️ Failed to load listings data</div>';
  });
</script>
</body>
</html>
